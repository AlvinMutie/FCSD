<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyLife Bridge</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      margin: 0;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .status-card {
      background: #1e293b;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status-card span {
      display: block;
      color: #94a3b8;
      font-size: 10px;
      margin-bottom: 2px;
    }
    .status-card strong {
      color: #38bdf8;
    }
    .preview-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 12px;
      display: none;
    }
    .preview-card h4 {
      margin: 0 0 6px 0;
      font-size: 13px;
      color: #f1f5f9;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #4f46e5;
      color: white;
      margin-bottom: 8px;
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    .btn-success {
      background: #059669;
      color: white;
    }
    .btn-success:hover {
      background: #047857;
    }
    .token-input {
      width: calc(100% - 16px);
      background: #090d16;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 8px;
      border-radius: 8px;
      font-size: 11px;
      margin-bottom: 8px;
    }
    .notice {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-icon">M</div>
    <div>
      <h3 class="title">MyLife Bridge</h3>
      <span class="badge">JKUAT SODeL MV3</span>
    </div>
  </div>

  <div id="pairing-section">
    <input type="password" id="pairing-token-input" class="token-input" placeholder="Paste Pairing Token (from MyLife OS)">
    <button id="save-token-btn" class="btn btn-primary">Save Token</button>
  </div>

  <div class="status-card" id="status-card">
    <span>DETECTED PAGE TYPE</span>
    <strong id="page-type-label">Scanning active tab...</strong>
  </div>

  <button id="scan-btn" class="btn btn-primary">Scan Current Page</button>

  <div class="preview-card" id="preview-card">
    <span style="font-size: 10px; color: #94a3b8;">EXTRACTED PREVIEW</span>
    <h4 id="preview-title">Assignment Title</h4>
    <div id="preview-details" style="color: #cbd5e1; font-size: 11px; line-height: 1.5;"></div>
    <button id="send-btn" class="btn btn-success" style="margin-top: 10px;">Send to MyLife OS Staging</button>
  </div>

  <div id="feedback" style="font-size: 11px; text-align: center; margin-top: 8px;"></div>

  <p class="notice">
    Read-only &bull; Zero password collection &bull; Human review required
  </p>

  <script src="src/normalizer.js"></script>
  <script src="src/api-client.js"></script>
  <script src="src/popup.js"></script>
</body>
</html>
